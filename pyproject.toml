[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telegabot"
version = "0.1.0"
description = "Telegram automation job queue service"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Telegabot" }
]
dependencies = [
  "fastapi~=0.110",
  "uvicorn[standard]~=0.29",
  "pymysql~=1.1",
  "sqlalchemy~=2.0",
  "cryptography~=42.0",
  "pydantic~=2.7",
  "pydantic-settings~=2.2",
  "telethon~=1.34",
  "python-multipart~=0.0.9",
  "python-dateutil~=2.9"
]

[project.optional-dependencies]
dev = [
  "black~=24.4",
  "isort~=5.13",
  "mypy~=1.10",
  "pytest~=8.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
